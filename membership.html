        <h1>My membership</h1>


        <section aria-labelledby="details-heading">
            <h2 id="details-heading">Current details</h2>

            <dl>
        <dt>Full name</dt>
        <dd id="display-name">Loading...</dd>

        <dt>Student ID</dt>
        <dd id="display-student-id">Loading...</dd>

        <dt>Email</dt>
        <dd id="display-email">Loading...</dd>

        <dt>Status</dt>
        <dd><span class="status-badge">Active</span></dd>
        </dl>
        </section>

        <section aria-labelledby="edit-heading">
            <h2 id="edit-heading">Edit contact details</h2>
            <p>Student ID and membership status cannot be edited here.</p>

            <form id="membership-form">
                <label for="full-name">Full name</label>
                <input
                    id="full-name"
                    name="full_name"
                    type="text"
                    value="Sample Student"
                    maxlength="100"
                    autocomplete="name"
                    required
                >

                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    value="student@example.com"
                    maxlength="254"
                    autocomplete="email"
                    required
                >

                <button type="submit">Save changes</button>
                <button type="button" id="cancel-edit">
                    Cancel edits
                </button>
            </form>

            <p id="membership-feedback" role="status"></p>
        </section>
    </main>
    <script src="navbar.js"></script>
</body>
