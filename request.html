        <h1>Request an announcement</h1>

        <p>
            Submit an announcement request for the club administrator
            to review. Your request will only be published after it
            has been approved by an administrator.
        </p>


        <!-- Announcement request form -->
        <form
            id="announcement-request-form"
            action="request.php"
            method="POST"
        >

            <label for="request-title">
                Title
            </label>

            <input
                id="request-title"
                name="title"
                type="text"
                maxlength="150"
                required
            >


            <label for="request-category">
                Category
            </label>

            <select
                id="request-category"
                name="category"
                required
            >

                <option value="">
                    Choose a category
                </option>

                <option value="General">
                    General
                </option>

                <option value="Events">
                    Events
                </option>

            </select>


            <label for="request-content">
                Announcement message
            </label>

            <textarea
                id="request-content"
                name="des"
                rows="6"
                maxlength="2000"
                required
            ></textarea>

            <button type="submit">
                Submit request
            </button>
        </form>

        <p>
            <a href="announcements.html">
                ← Back to announcements
            </a>
        </p>

    </main>
