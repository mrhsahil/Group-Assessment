<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | University Club</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

<nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="admin.html" aria-current="page">Admin Dashboard</a>
    <a href="announcements.html">Announcements</a>
    <a href="logout.php">Logout</a>
</nav>


        <h1>Admin dashboard</h1>


        <div class="dashboard-grid">

            <section class="dashboard-card">

                <h2>Memberships</h2>

                <p>
                    <button type="button" id="toggle-members">
                        <strong id="member-count">0</strong>
                        Registered Members ▼
                    </button>
                </p>

                <div id="member-list" hidden></div>

            </section>

            <section class="dashboard-card">

                <h2>Announcements</h2>

                <p>
                    <strong id="announcement-count">0</strong>
                    announcements
                </p>

                <p>
                    Create, edit, and delete club announcements.
                </p>

                <p>
                    <a href="#manage-announcements">
                        Manage announcements
                    </a>
                </p>

            </section>
            <section id="announcement-requests">

    <h2>Announcement requests</h2>

    <div id="request-list">
            <p>Loading requests...</p>
            </div>

            </section>

        </div>


        <!-- Manage announcements -->
        <section id="manage-announcements">

            <h2>Manage announcements</h2>

            <form
                id="announcement-form"
                action="announcement.php"
                method="POST"
            >

                <label for="announcement-title">
                    Title
                </label>

                <input
                    id="announcement-title"
                    name="title"
                    type="text"
                    maxlength="150"
                    required
                >


                <label for="announcement-category">
                    Category
                </label>

                <select
                    id="announcement-category"
                    name="category"
                    required
                >

                    <option value="">
                        Choose a category
                    </option>

                    <option value="General">
                        General
                    </option>

                    <option value="Events">
                        Events
                    </option>

                </select>


                <label for="announcement-content">
                    Announcement message
                </label>

                <textarea
                    id="announcement-content"
                    name="des"
                    rows="6"
                    maxlength="2000"
                    required
                ></textarea>


                <button type="submit">
                    Publish
                </button>

            </form>


            <h3>Existing announcements</h3>

            <div id="admin-announcement-list"></div>

        </section>

        <p>
            <a href="dashboard.html">
                View member dashboard
            </a>
        </p>

    </main>


    <script src="admin.js"></script>
    <script src="navbar.js"></script>

</body>

</html>
