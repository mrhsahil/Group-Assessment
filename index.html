<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Club</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body>

<main>
    <h1>Welcome to University Club</h1>
    <p class="intro">Connect with other students and stay informed.</p>

    <section>
        <h2>Membership</h2>
        <p>Member registration and membership management are coming soon.</p>
    </section>

    <section>
        <h2>Announcements</h2>
        <p>No announcements yet. Check back for club updates.</p>
    </section>
</main>

<div class="chat-container" id="chatContainer">
    <div class="chat-header">
        <strong>🎓 Club Assistant</strong>
        <button class="close-btn" onclick="closeChat()">×</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="bot-message">Hi! How can I help you?</div>
    </div>

    <div class="suggestions">
        <button onclick="quickQuestion('How do I join the club?')">Join Club</button>
        <button onclick="quickQuestion('Where can I see announcements?')">Announcements</button>
    </div>

    <div class="chat-input">
        <input id="userInput" placeholder="Ask a question...">
        <button id="sendButton">Send</button>
    </div>
</div>

<button class="chat-button" id="chatButton" onclick="openChat()">💬</button>

<script src="chatbot.js"></script>
</body>
</html>
